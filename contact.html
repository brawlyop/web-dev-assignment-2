        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333333;
            margin: 15px;
        }

        h1, h2, h3 {
            color: #174ea6;
        }

        /* Header and navigation */
        header {
            background-color: #174ea6;
            color: white;
            padding: 10px;
        }

        header h1 {

        nav {

        nav li {

        nav a {

        }
/* Sections and spacing */
        section {
            background-color: white;
            border: 1px solid #cccccc;
            padding: 15px;

        }

        hr {

        }

        img {
            border: 2px solid #174ea6;

        }

        /* Skills table */
        table {
            border-collapse: collapse;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            background-color: white;
        }

        th, td {
            border: 1px solid #174ea6;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #174ea6;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e8f0fb;
        }

        /* Form and button */
        form {
            background-color: #e8f0fb;
            border: 1px solid #174ea6;
            padding: 15px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        input {
            padding: 6px;
            margin: 5px;
            border: 1px solid #999999;
        }

        button {
            background-color: #174ea6;
            color: white;
            padding: 8px 18px;
            border: none;
            border-radius: 4px;
        }
/* Back to top link */
        .top-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: #174ea6;
            color: white;
            padding: 8px;

        }
